<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NORMALBLOX STORE — NormalFunk</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-auth: #090514;
      --bg-purple: #16092e;
      --bg-main: #0c0e14;
      --surface: #151923;
      --surface-2: #1d2230;
      --accent: #facc15;
      --accent-2: #eab308;
      --neon: #4ade80;
      --danger: #f87171;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.09);
      --highlight: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==================== ЭКРАН ВХОДА / АНИМАЦИЯ ==================== */
    #authScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at 20% 15%, #240c4a 0%, #110624 48%, #07040e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .diagonal-beam {
      position: absolute;
      top: -35%;
      left: -35%;
      width: 170%;
      height: 10px;
      background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.25), #facc15, rgba(250, 204, 21, 0.25), transparent);
      box-shadow: 0 0 24px rgba(250, 204, 21, 0.85), 0 0 50px rgba(250, 204, 21, 0.45);
      transform: rotate(36deg);
      animation: sweepBeam 3.2s linear infinite;
      pointer-events: none;
    }

    @keyframes sweepBeam {
      0% {
        transform: translate(-45%, -45%) rotate(36deg);
        opacity: 0.25;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translate(45%, 45%) rotate(36deg);
        opacity: 0.25;
      }
    }

    .auth-box {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      background: rgba(18, 12, 34, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(250, 204, 21, 0.28);
      border-radius: 22px;
      padding: 24px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .auth-title {
      font-size: 23px;
      font-weight: 900;
      color: var(--accent);
      text-align: center;
      letter-spacing: 0.4px;
    }

    .auth-sub {
      margin-top: 8px;
      font-size: 13px;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.45;
    }

    .auth-actions {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn-yellow {
      background: var(--accent);
      color: #090a0f;
      border-color: var(--accent);
      font-weight: 800;
    }

    .btn-yellow:hover {
      background: var(--accent-2);
    }

    .btn-ghost {
      background: rgba(250, 204, 21, 0.09);
      border-color: rgba(250, 204, 21, 0.4);
      color: var(--accent);
    }

    .field {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0d0b16;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
    }

    .auth-error {
      margin-top: 10px;
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
      text-align: center;
    }

    /* ==================== ОСНОВНОЙ ИНТЕРФЕЙС ==================== */
    #appScreen {
      display: none;
      padding-bottom: 155px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      background: rgba(12, 14, 20, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .topbar-brand {
      font-weight: 900;
      font-size: 16px;
      color: var(--accent);
    }

    .topbar-user {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .container {
      padding: 14px 16px;
      max-width: 680px;
      margin: 0 auto;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .center-msg {
      text-align: center;
      line-height: 1.5;
      font-size: 14px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .menu-btn {
      padding: 12px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
    }

    .menu-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .menu-btn.wide {
      grid-column: 1 / -1;
    }

    .price-list {
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 13px;
    }

    .price-name {
      font-weight: 700;
      font-size: 14px;
    }

    .price-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .old-price {
      text-decoration: line-through;
      color: var(--danger);
      font-size: 11px;
      margin-right: 6px;
    }

    .new-price {
      color: var(--neon);
      font-weight: 800;
      font-size: 14px;
    }

    .mini-btn {
      padding: 7px 11px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #090a0f;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .choice-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 11px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin: 4px 4px 0 0;
    }

    .choice-chip.active {
      background: rgba(250, 204, 21, 0.18);
      border-color: var(--accent);
      color: var(--accent);
    }

    .msg-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      cursor: pointer;
    }

    .msg-card.unread {
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.25);
    }

    .chat-messages {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
      padding: 8px;
      background: #0d0b16;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .chat-msg {
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 80%;
      font-size: 13px;
      line-height: 1.4;
    }

    .chat-msg.incoming {
      background: var(--surface-2);
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }

    .chat-msg.outgoing {
      background: var(--accent);
      color: #090a0f;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
      font-weight: 650;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: var(--accent);
      flex-shrink: 0;
    }

    .tab-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #090a0f;
      border-color: var(--accent);
    }

    /* ==================== ОБУЧАЛКА СО ШКИПЕРОМ ==================== */
    #skipperTutorial {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 78px;
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }

    #skipperTutorial.active {
      display: flex;
    }

    .skipper-bubble {
      background: #1b1530;
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 12px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
      pointer-events: auto;
      max-width: 100%;
    }

    .skipper-row {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .skipper-avatar {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--accent);
      color: #090a0f;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .skipper-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tutorial-highlight {
      position: relative;
      z-index: 65 !important;
      outline: 3px solid var(--highlight) !important;
      box-shadow: 0 0 0 6px rgba(250, 204, 21, 0.28), 0 0 24px rgba(250, 204, 21, 0.85) !important;
      animation: pulseGlow 1.1s infinite alternate;
    }

    @keyframes pulseGlow {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.02);
      }
    }

    /* ==================== НИЖНЕЕ МЕНЮ (8 КНОПОК) ==================== */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(11, 13, 19, 0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      padding: 6px 2px;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px 1px;
      cursor: pointer;
      border-radius: 8px;
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .nav-item span {
      font-size: 8px;
      font-weight: 700;
      line-height: 1.05;
      text-align: center;
      color: #ffffff;
      word-break: break-all;
    }

    .nav-item.active svg {
      stroke: var(--accent);
    }

    .nav-item.active span {
      color: var(--accent);
    }

    /* Модалка оплаты и подтверждения */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 18px;
      padding: 18px;
    }
  </style>
</head>
<body>

  <!-- ==================== 1. ЭКРАН АВТОРИЗАЦИИ ==================== -->
  <div id="authScreen">
    <div class="diagonal-beam"></div>
    <div class="auth-box" id="authBox">
      <div class="auth-title">ДОБРО ПОЖАЛОВАТЬ</div>
      <div class="auth-sub">
        В магазин <b>NORMALBLOX STORE</b> и пространство <b>NormalFunk</b>. Выбери способ входа, чтобы продолжить.
      </div>
      <div class="auth-actions">
        <button class="btn btn-yellow" onclick="openAuthForm('register')">ЗАРЕГЕСТРИРОВАТЬСЯ</button>
        <button class="btn" onclick="openAuthForm('login')">ВОЙТИ</button>
        <button class="btn btn-ghost" onclick="openAuthForm('guest')">ПРОДОЛЖИТЬ КАК ГОСТЬ</button>
      </div>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <!-- ==================== 2. ОСНОВНОЕ ПРИЛОЖЕНИЕ ==================== -->
  <div id="appScreen">
    <div class="topbar">
      <div class="topbar-brand">⚡ NORMALBLOX STORE</div>
      <div class="topbar-user" id="topbarUser"></div>
    </div>

    <div class="container" id="viewContainer"></div>

    <!-- Обучалка со Шкипером -->
    <div id="skipperTutorial">
      <div class="skipper-bubble" id="skipperBubble"></div>
      <div class="skipper-row">
        <div class="skipper-avatar" id="skipperAvatar">
          <!-- Для аватара Шкипера используется скриншот от пользователя (image_33.png) -->
          <img src="skipper.png" alt="Шкипер" onerror="this.src='https://i.ibb.co/6P93v0P/skipper.png'; this.onerror=null;" />
        </div>
      </div>
    </div>

    <!-- Модальное окно оформления / оплаты -->
    <div class="modal-backdrop" id="checkoutModal">
      <div class="modal-card">
        <div class="section-title" id="modalTitle">Оформление заказа</div>
        <div class="muted" id="modalDesc" style="margin-bottom: 10px;"></div>
        <div class="field" id="paymentFieldBox">
          <label>Способ оплаты</label>
          <select id="paymentSelect" onchange="onPaymentSelected()">
            <option value="">— Выберите способ оплаты —</option>
            <option value="Humo">Humo</option>
            <option value="UzCard">UzCard</option>
            <option value="Payme">Payme</option>
            <option value="Uzum Bank">Uzum Bank</option>
            <option value="Наличные">Наличные</option>
          </select>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 14px;">
          <button class="btn" onclick="closeCheckoutModal()">Отмена</button>
          <button class="btn btn-yellow" id="confirmOrderBtn" onclick="confirmOrder()">Купить</button>
        </div>
      </div>
    </div>

    <!-- Нижнее меню из 8 кнопок с белыми иконками -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-nav="home" onclick="navigate('home')">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
        <span>ГЛАВНАЯ</span>
      </button>

      <button class="nav-item" id="navShopBtn" data-nav="shop" onclick="navigate('shop')">
        <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 12H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span>МАГАЗИН</span>
      </button>

      <button class="nav-item" id="navMessagesBtn" data-nav="messages" onclick="navigate('messages')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>СООБЩЕНИЯ</span>
      </button>

      <button class="nav-item" data-nav="other" onclick="navigate('other')">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <span>ДРУГОЕ</span>
      </button>

      <button class="nav-item" data-nav="team" onclick="navigate('team')">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>В КОМАНДУ</span>
      </button>

      <button class="nav-item" data-nav="about" onclick="navigate('about')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span>О НАС / БОТЕ</span>
      </button>

      <button class="nav-item" data-nav="feedback" onclick="navigate('feedback')">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span>БАГИ / ИДЕИ</span>
      </button>

      <button class="nav-item" data-nav="profile" onclick="navigate('profile')">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>ПРОФИЛЬ</span>
      </button>
    </nav>
  </div>

  <script>
    /* ==================== НАСТРОЙКИ ОТПРАВКИ В TELEGRAM ==================== */
    const BOT_TOKEN = "";
    const ADMIN_CHAT_ID = "";
    const ADMIN_USERNAME = "NormalFunk";

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;

    /* ==================== ФОРМУЛА ЦЕНЫ (+40% И ОКРУГЛЕНИЕ ДО 1000) ==================== */
    function markupPrice(baseSum) {
      const withMarkup = baseSum * 1.4;
      return Math.round(withMarkup / 1000) * 1000;
    }

    function fmtSum(val) {
      return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " сум";
    }

    const SHOP_DATA = {
      roblox: [
        { name: "40 Robux", base: 15000 },
        { name: "80 Robux", base: 25000 },
        { name: "120 Robux", base: 45000 },
        { name: "400 Robux", base: 90000 },
        { name: "800 Robux", base: 150000 },
        { name: "1700 Robux", base: 270000 }
      ],
      bsGems: [
        { name: "30 Gems", base: 25000 },
        { name: "80 Gems", base: 60000 },
        { name: "170 Gems", base: 100000 },
        { name: "360 Gems", base: 170000 },
        { name: "950 Gems", base: 400000 },
        { name: "2000 Gems", base: 760000 }
      ],
      bsPass: [
        { name: "Brawl Pass", base: 90000 },
        { name: "Brawl Pass Plus", base: 130000 },
        { name: "PRO Pass", base: 200000 }
      ],
      fcPoints: [
        { name: "40 FC Points", base: 25000 },
        { name: "100 FC Points", base: 55000 },
        { name: "500 FC Points", base: 125000 },
        { name: "1000 FC Points", base: 230000 },
        { name: "2000 FC Points", base: 380000 },
        { name: "5000 FC Points", base: 900000 },
        { name: "10000 FC Points", base: 1750000 }
      ],
      so2Pass: [
        { name: "Gold Pass", base: 210000 },
        { name: "Gold Pass + 10 УРОВНЕЙ", base: 330000 }
      ],
      so2Gold: [
        { name: "100 Gold", base: 75000, oldBase: null },
        { name: "500 Gold", base: 150000, oldBase: 180000 },
        { name: "1000 Gold", base: 250000, oldBase: 330000 },
        { name: "3000 Gold", base: 500000, oldBase: 900000 }
      ]
    };

    const BRAINROT_MUTATIONS = [
      "⚪️ Normal",
      "🟡 Gold",

        </div>
        <div class="auth-error" id="authError"></div>
      `;
    }

    function submitRegStep1() {
      const email = document.getElementById("regEmail").value.trim();
      const pass = document.getElementById("regPass").value.trim();
      const nick = document.getElementById("regNick").value.trim();
      const err = document.getElementById("authError");

      if (!email || !pass || !nick) {
        err.textContent = "Заполните почту, пароль и ник.";
        return;
      }

      tempRegData = { email, pass, nick };
      const preTg = tgUser && tgUser.username ? `@${tgUser.username}` : "@";

      document.getElementById("authBox").innerHTML = `
        <div class="auth-title">ПОЧТИ ГОТОВО</div>
        <div class="auth-sub">Укажите свой ник в Telegram (через @), чтобы мы могли связаться с вами.</div>
        <div class="field">
          <label>Ник в ТГ (через @)</label>
          <input type="text" id="regTg" value="${preTg}" placeholder="@username" />
        </div>
        <div style="display:flex; gap:8px; margin-top:16px;">
          <button class="btn" onclick="openAuthForm('register')">Назад</button>
          <button class="btn btn-yellow" onclick="finishRegistration()">ЗАВЕРШИТЬ</button>
        </div>
        <div class="auth-error" id="authError"></div>
      `;
    }

    function finishRegistration() {
      let tgHandle = document.getElementById("regTg").value.trim();
      const err = document.getElementById("authError");
      if (!tgHandle.startsWith("@") || tgHandle.length < 2) {
        err.textContent = "Введите ник в ТГ через @.";
        return;
      }

      const db = loadUsersDB();
      const userObj = {
        mode: "registered",
        email: tempRegData.email,
        pass: tempRegData.pass,
        nick: tempRegData.nick,
        tgUsername: tgHandle,
        fastPayerScore: "Новый покупатель (оценка формируется)"
      };
      db.push(userObj);
      saveUsersDB(db);
      promptTutorial(userObj);
    }

    function submitLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      const err = document.getElementById("authError");

      const db = loadUsersDB();
      const found = db.find((u) => u.email === email && u.pass === pass);
      if (!found) {
        err.textContent = "Неверная почта или пароль.";
        return;
      }
      promptTutorial(found);
    }

    function submitGuest() {
      const tgHandle = document.getElementById("guestTg").value.trim();
      const nick = document.getElementById("guestNick").value.trim();
      const err = document.getElementById("authError");

      if (!tgHandle.startsWith("@") || tgHandle.length < 2) {
        err.textContent = "Укажите ник в ТГ через @.";
        return;
      }
      if (!nick) {
        err.textContent = "Укажите ваш НИК.";
        return;
      }

      const guestObj = {
        mode: "guest",
        nick,
        tgUsername: tgHandle,
        fastPayerScore: "Гость • Наблюдение за оплатами"
      };
      promptTutorial(guestObj);
    }

    function updateTutorialUI() {
      const box = document.getElementById("skipperTutorial");

      clearHighlights();

      if (tutorialStep === 0) {
        box.classList.remove("active");
        return;
      }

      box.classList.add("active");

      if (tutorialStep === 1) {
        bubble.textContent = "ЧТО-БЫ КУПИТЬ ЧТО-ТО ТО НАЖМИТЕ НА КНОПКУ МАГАЗИН";

        if (buyBtn) buyBtn.classList.add("tutorial-highlight");

        if (chatItem) chatItem.classList.add("tutorial-highlight");

    function clearHighlights() {
      document.querySelectorAll(".tutorial-highlight").forEach((el) => {
        el.classList.remove("tutorial-highlight");
      });

      tutorialStep = 0;
      clearHighlights();
      document.getElementById("skipperTutorial").classList.remove("active");
      navigate("home");

    /* ==================== НАВИГАЦИЯ ==================== */
    function navigate(navName) {
      currentNav = navName;
      if (navName === "shop") shopSubView = "menu";
      if (navName === "other") otherSubView = "menu";

      document.querySelectorAll(".nav-item").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.nav === navName);
      });

      if (tutorialStep === 1 && navName === "shop") {
        tutorialStep = 2;
      } else if (tutorialStep === 4 && navName === "messages") {
        tutorialStep = 5;
      }

      renderCurrentView();
      updateTutorialUI();
    }

      const container = document.getElementById("viewContainer");

      if (currentNav === "home") {

      } else if (currentNav === "messages") {
        container.innerHTML = renderMessagesView();
      } else if (currentNav === "other") {
        container.innerHTML = renderOtherView();
      } else if (currentNav === "team") {
        container.innerHTML = renderTeamView();
      } else if (currentNav === "about") {
        container.innerHTML = renderAboutView();
      } else if (currentNav === "feedback") {

      } else if (currentNav === "profile") {

    function submitBrainrotQuiz() {

    /* ==================== ОФОРМЛЕНИЕ ЗАКАЗА И ОПЛАТА ==================== */
    function openOrderModal(category, itemName, price, isTutorialItem = false) {
      pendingOrder = { category, itemName, price, isTutorialItem };
      document.getElementById("modalTitle").textContent = `Покупка: ${itemName}`;
      document.getElementById("modalDesc").textContent =
        price === 0
          ? "Стоимость: 0 сум. Выберите способ оплаты и нажмите «Купить»."
          : `Категория: ${category} • Итого к оплате: ${fmtSum(price)}.`;
      document.getElementById("paymentSelect").value = "";
      document.getElementById("checkoutModal").classList.add("open");

      if (tutorialStep === 2 && isTutorialItem) {
        // Мы НЕ меняем шаг туториала на 3 СРАЗУ, дабы не спугнуть highlight, 
        // а ждём пока юзер действительно откроет и начнет выбирать.
      }
    }

    function onPaymentSelected() {
      if (tutorialStep === 2 && pendingOrder && pendingOrder.isTutorialItem) {
        tutorialStep = 3;
        updateTutorialUI();
      }
    }

    function closeCheckoutModal() {
      pendingOrder = null;
      document.getElementById("checkoutModal").classList.remove("open");
      if (tutorialStep === 3) {
        tutorialStep = 2;
        updateTutorialUI();
      }
    }

    function confirmOrder() {
      if (!pendingOrder) return;
      const method = document.getElementById("paymentSelect").value;
      if (!method) {
        alert("Пожалуйста, выберите способ оплаты.");
        return;
      }

      const { category, itemName, price, isTutorialItem } = pendingOrder;
      const priceStr = price === 0 ? "0 сум (Обучение)" : fmtSum(price);

      const text =
        `🛒 *НОВЫЙ ЗАКАЗ — NORMALBLOX STORE*\n` +
        `• Раздел: ${category}\n` +
        `• Товар: ${itemName}\n` +
        `• Сумма: ${priceStr}\n` +
        `• Способ оплаты: ${method}`;

      recordOrderAndNotify(category, itemName, priceStr, text, method);
      closeCheckoutModal();

      if (isTutorialItem) {
        tutorialStep = 4;
        navigate("messages");
      }
    }

    /* ==================== 3. СООБЩЕНИЯ (ВСТРОЕННЫЙ ЧАТ) ==================== */
    function renderMessagesView() {
      const adminId = "NormalFunk";
      const history = threadChatHistory[adminId] || [
        { sender: "admin", text: `Добро пожаловать в поддержку NORMALBLOX STORE! Вы можете написать @${ADMIN_USERNAME} прямо здесь.` }
      ];

      return `
        <div class="panel" id="tutChatItem">
          <div class="section-title">💬 ЧАТ С АДМИНИСТРАТОРОМ NormalFunk</div>
          <p class="muted">Вы общаетесь напрямую внутри приложения.</p>
          
          <div class="chat-messages" id="chatScreenContainer">
            ${history.map((msg) => `
              <div class="chat-msg ${msg.sender === "user" ? "outgoing" : "incoming"}">
                ${escapeHtml(msg.text)}
              </div>
            `).join("")}
          </div>

          <div class="chat-input-row">
            <input type="text" id="chatInputField" placeholder="Введите ваше сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()" />
            <button class="btn btn-yellow" style="width: auto; padding: 0 16px;" onclick="sendChatMessage()">Отправить</button>
          </div>

          ${
            tutorialStep === 5
              ? `<button class="btn btn-yellow" style="margin-top:14px;" onclick="finishTutorial()">ЗАВЕРШИТЬ ОБУЧЕНИЕ</button>`
              : ""
          }
        </div>
      `;
    }

    function sendChatMessage() {
      const input = document.getElementById("chatInputField");
      const text = input ? input.value.trim() : "";
      if (!text) return;

      const adminId = "NormalFunk";
      if (!threadChatHistory[adminId]) {
        threadChatHistory[adminId] = [];
      }

      threadChatHistory[adminId].push({ sender: "user", text });
      
      // Бот-уведомление администратору о сообщении в чате
      dispatchToAdmin("Новое сообщение в чате", `💬 *Сообщение от пользователя*:\n${text}`);

      input.value = "";
      renderCurrentView();

      // Авто-скролл вниз
      const chatContainer = document.getElementById("chatScreenContainer");
      if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
    }

          <div class="field">
            <label>🛠 Опишите обнаруженный баг (где ошибка, что пошло не так)</label>
            <textarea id="bugInput" rows="3" placeholder="1. Где произошла ошибка...\n2. Что именно пошло не так..."></textarea>
          </div>
          <button class="btn btn-yellow" style="margin-top:8px;" onclick="sendSimpleRequest('Сообщение о баге', 'bugInput')">🐛 Написать о баге</button>

          <div class="field" style="margin-top:16px;">
            <label>💡 Напишите ваше предложение или идею одним сообщением</label>
            <textarea id="ideaInput" rows="3" placeholder="Опишите идею как можно подробнее..."></textarea>
          </div>
          <button class="btn" style="margin-top:8px;" onclick="sendSimpleRequest('Предложение / Идея', 'ideaInput')">💡 Предложить идею</button>
        </div>
      `;
    }

    /* ==================== 8. ПРОФИЛЬ (ВСЕ ЗАКАЗЫ + ОЦЕНКА) ==================== */
    function renderProfileView() {
      const orders = loadOrders().filter((o) => o.ownerNick === currentUser.nick);
      const initial = (currentUser.nick || "N").charAt(0).toUpperCase();

      return `
        <div class="panel">
          <div class="profile-head">
            ${
              currentUser.avatar
                ? `<img class="avatar" src="${escapeHtml(currentUser.avatar)}" alt="Аватар" />`
                : `<div class="avatar">${escapeHtml(initial)}</div>`
            }
            <div>
              <div style="font-size:18px; font-weight:900; color:var(--accent);">${escapeHtml(currentUser.nick)}</div>
              <div class="muted">${escapeHtml(currentUser.tgUsername)} • Режим: ${currentUser.mode === "guest" ? "Гость" : "Аккаунт"}</div>
            </div>
          </div>

          <div class="tab-row">
            <button class="tab-btn ${profileTab === "orders" ? "active" : ""}" onclick="setProfileTab('orders')">📦 ВСЕ ЗАКАЗЫ (${orders.length})</button>
            <button class="tab-btn ${profileTab === "rating" ? "active" : ""}" onclick="setProfileTab('rating')">⭐ ОЦЕНКА ОПЛАТЫ</button>
          </div>

          ${
            profileTab === "orders"
              ? `<div style="margin-top:12px;">
                  ${
                    orders.length === 0
                      ? `<p class="muted">У вас пока нет оформленных заказов.</p>`
                      : orders.map((o) => `
                          <div class="price-row" style="margin-bottom:8px;">
                            <div>
                              <div class="price-name">${escapeHtml(o.itemName)}</div>
                              <div class="price-sub">${escapeHtml(o.category)} • Оплата: ${escapeHtml(o.paymentMethod || "—")} • ${escapeHtml(o.time)}</div>
                            </div>
                            <span class="new-price">${escapeHtml(o.priceStr)}</span>
                          </div>
                        `).join("")
                  }
                </div>`
              : `<div style="margin-top:12px;" class="muted">
                  <p><b>Статус надёжности по оплатам:</b> ${escapeHtml(currentUser.fastPayerScore)}</p>
                  <p style="margin-top:6px;">
                    Отметка показывает, оплачивает ли покупатель заказы оперативно после оформления заявки.
                  </p>
                </div>`
          }

          <button class="btn" style="margin-top:16px;" onclick="logoutUser()">Выйти из профиля</button>
        </div>
      `;
    }

    function setProfileTab(tab) {
      profileTab = tab;
      renderCurrentView();
    }

    /* ==================== ЗАПИСЬ ЗАКАЗА И ОТПРАВКА С ССЫЛКОЙ НА ЧАТ ==================== */
    function getUserChatLink() {
      const cleanHandle = (currentUser.tgUsername || "").replace(/^@/, "").trim();
      if (cleanHandle) {
        return `https://t.me/${cleanHandle}`;
      }
      return `https://t.me/${ADMIN_USERNAME}`;
    }

    function recordOrderAndNotify(category, itemName, priceStr, formattedText, paymentMethod = "—") {
      const orders = loadOrders();
      orders.unshift({
        ownerNick: currentUser.nick,
        category,
        itemName,
        priceStr,
        paymentMethod,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      });
      saveOrders(orders);

      dispatchToAdmin("Новый заказ", formattedText);
    }

    function dispatchToAdmin(headerTitle, bodyMarkdown) {
      const chatLink = getUserChatLink();
      const fullReport =
        `${bodyMarkdown}\n` +
        `• Покупатель: ${currentUser.nick} (${currentUser.tgUsername})\n` +
        `• Чат с пользователем: ${chatLink}`;

      // Отправка в бот Telegram, если настроены BOT_TOKEN и ADMIN_CHAT_ID
      if (BOT_TOKEN && ADMIN_CHAT_ID) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: ADMIN_CHAT_ID,
            text: fullReport,
            parse_mode: "Markdown"
          })
        }).catch(() => {});
      }

      // Если запущено в Telegram Mini App, отправляем данные обратно в бота
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({
          type: "user_action",
          action: headerTitle,
          details: fullReport
        }));
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    
    // Инициализация при открытии страницы
    resetAuthStart();
  </script>
</body>
</html>
